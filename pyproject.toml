[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medquad-qa"
version = "0.1.0"
description = "MedQuAD Evidence-Grounded Medical QA — non-clinical research prototype"
readme = "README_en.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
# Core deps only. ML/service extras are added after the architecture gate (see docs/decisions.md).
dependencies = [
  "pydantic>=2.7,<3",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "pyyaml>=6",
]

[project.optional-dependencies]
# torch is installed separately from the cu130 index (see Makefile `venv`) and pinned via constraints/torch-cu130.txt.
ml = [
  "transformers>=5.18,<6",
  "peft>=0.21,<0.22",
  "accelerate>=1.15,<2",
  "safetensors>=0.4",
  "huggingface-hub>=0.30",
  "sentence-transformers>=3.0",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "matplotlib>=3.8",
]
retrieval = [
  "bm25s>=0.2.10,<0.3",
  "PyStemmer>=2.2",
  "qdrant-client>=1.12,<2",
  "langchain-core>=0.3",
]
api = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.4,<3",
  "prometheus-client>=0.20,<1",
  "httpx>=0.27,<1",
]
ui = ["streamlit>=1.38,<2", "httpx>=0.27,<1"]
tracking = ["mlflow>=3.16,<4"]
eval = ["rouge-score==0.1.2", "detect-secrets>=1.5"]
tf = ["tensorflow==2.21.*"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-timeout>=2.3",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Frozen test tokenizer used by medquad_qa.models.testing (D-079); without this a wheel install omits it.
"medquad_qa.models" = ["tiny_tokenizer.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "gpu: requires a CUDA GPU",
  "real_model: downloads/loads real model weights",
  "real_data: requires the local medquad.csv",
  "docker: requires a running Docker daemon/stack",
  "slow: long-running",
  "integration: cross-module integration test",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true

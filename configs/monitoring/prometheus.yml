# Prometheus scrape config for the local stack (profile "monitoring"). Owner: service-platform-engineer.
# Scrapes the API on the internal compose network; Prometheus itself is published on 127.0.0.1 only.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: medquad-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

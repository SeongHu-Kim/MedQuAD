# Main closed-book LoRA SFT run (D-013). Approved hyperparameters (handoff §5).
format_version: sft-closed-v1
max_seq_len: 1024
seed: 42
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear
optim:
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_fraction: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
per_device_batch_size: 4
grad_accum_steps: 4          # effective batch 16
num_train_epochs: 1
max_steps: null              # set from the 20-step smoke projection if a full epoch would exceed the cap
time_cap_hours: 2.5          # hard wall-clock cap; training stops and the run is marked partial
bf16: true
gradient_checkpointing: true
sampling: group_by_length
logging_steps: 10
save_steps: 200
eval_max_examples: 512       # validation-split SFT examples for val loss (before and after training)

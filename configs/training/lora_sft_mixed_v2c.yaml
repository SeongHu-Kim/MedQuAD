# Adapter v2: mixed closed-book + RAG-cited SFT (D-051). Same hyperparameters as v1 except max_seq_len.
format_version: sft-closed-v1
max_seq_len: 2048            # RAG examples (5 evidence blocks); closed-book examples keep 1024 (mix_v2.yaml)
seed: 42
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear
optim:
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_fraction: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
per_device_batch_size: 4
grad_accum_steps: 4          # effective batch 16
num_train_epochs: 1
max_steps: null              # 1 epoch over the mix; confirmed by a 20-step smoke projection
time_cap_hours: 7            # v2c full run: cap raised to 7 h (D-054, user decision after the v2c smoke projection)
bf16: true
gradient_checkpointing: true
sampling: group_by_length
logging_steps: 10
save_steps: 200
eval_max_examples: 512       # validation-split SFT examples for val loss (before and after training)
